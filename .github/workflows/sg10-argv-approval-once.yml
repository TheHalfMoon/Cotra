name: SG-000010 Argv Approval Patch Once

on:
  push:
    branches:
      - feat/sg-000010-implementation

permissions:
  contents: write

jobs:
  patch-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000010-implementation
          fetch-depth: 0
      - name: Narrow Windows argv authority and make approval display exact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          policy = Path('crates/cotra-policy/src/lib.rs')
          p = policy.read_text(encoding='utf-8')
          anchor = '''    if argv.len() > MAX_PROCESS_ARGV_ITEMS {
              return Err(PolicyError::new(
                  FailureCode::InvalidRequest,
                  format!("process.spawn argv exceeds {MAX_PROCESS_ARGV_ITEMS} items"),
              ));
          }
          '''
          insertion = anchor + '''
          #[cfg(windows)]
          if !argv.is_empty() {
              return Err(PolicyError::new(
                  FailureCode::CapabilityDenied,
                  "SG-000010 Windows process.spawn permits only the qualified no-argument whoami.exe fixture; argv authority widening is a successor grain",
              ));
          }
          '''
          if anchor not in p:
              raise SystemExit('policy argv anchor not found')
          p = p.replace(anchor, insertion, 1)
          p = p.replace('''                "argv": ["--version"],''', '''                "argv": [],''', 1)

          test_anchor = '''        for name in ["cmd.exe", "WindowsPowerShell\\\\v1.0\\\\powershell.exe"] {'''
          test_insert = '''        let mut argv_request = process_request(&system32.join("whoami.exe"));
          argv_request.arguments["argv"] = json!(["/user"]);
          let argv_error = engine(&root)
              .authorize(&argv_request)
              .expect_err("SG-000010 must not widen argv authority before successor qualification");
          assert_eq!(argv_error.code, FailureCode::CapabilityDenied);

          for name in ["cmd.exe", "WindowsPowerShell\\\\v1.0\\\\powershell.exe"] {'''
          if test_anchor not in p:
              raise SystemExit('policy Windows test anchor not found')
          p = p.replace(test_anchor, test_insert, 1)
          policy.write_text(p, encoding='utf-8')

          daemon = Path('crates/cotrad/src/main.rs')
          d = daemon.read_text(encoding='utf-8')
          old = '''        summary: format!(
              "argv={} cwd={} timeout={}ms stdout_limit={} stderr_limit={} stdin=null network=NONE",
              plan.argv.len(),
              plan.cwd.display(),
              plan.limits.timeout.as_millis(),
              plan.limits.stdout_bytes,
              plan.limits.stderr_bytes
          ),'''
          new = '''        summary: format!(
              "argv={:?} cwd={} timeout={}ms stdout_limit={} stderr_limit={} stdin=null network=NONE",
              plan.argv,
              plan.cwd.display(),
              plan.limits.timeout.as_millis(),
              plan.limits.stdout_bytes,
              plan.limits.stderr_bytes
          ),'''
          if old not in d:
              raise SystemExit('approval summary anchor not found')
          d = d.replace(old, new, 1)
          daemon.write_text(d, encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/sg10-argv-approval-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: keep SG-000010 argv authority explicit'
          git push origin HEAD:feat/sg-000010-implementation
