name: SG-000010 Qualification Repair Once

on:
  push:
    branches:
      - feat/sg-000010-implementation

permissions:
  contents: write

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000010-implementation
          fetch-depth: 0
      - name: Repair exact-head qualification and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          daemon = Path('crates/cotrad/src/main.rs')
          d = daemon.read_text(encoding='utf-8')

          old_import = '    use cotra_approval::{test_support::FixedApprovalBroker, ApprovalError, ApprovalPrompt};'
          new_import = '''    use cotra_approval::{ApprovalError, ApprovalPrompt};
              #[cfg(windows)]
              use cotra_approval::test_support::FixedApprovalBroker;'''
          if old_import not in d:
              raise SystemExit('cotrad test import anchor not found')
          d = d.replace(old_import, new_import, 1)

          old_executable = '''        let executable = std::env::current_exe().expect("test executable");
              let request = process_request(&workspace, executable);'''
          new_executable = '''        #[cfg(windows)]
              let executable = {
                  let system_root = std::env::var_os("SystemRoot").expect("SystemRoot");
                  PathBuf::from(system_root).join("System32").join("whoami.exe")
              };
              #[cfg(not(windows))]
              let executable = std::env::current_exe().expect("test executable");
              let request = process_request(&workspace, executable);'''
          if old_executable not in d:
              raise SystemExit('cotrad approval test executable anchor not found')
          d = d.replace(old_executable, new_executable, 1)

          old_summary = '''        summary: format!(
              "argv={} cwd={} timeout={}ms stdout_limit={} stderr_limit={} stdin=null network=NONE",
              plan.argv.len(),
              plan.cwd.display(),
              plan.limits.timeout.as_millis(),
              plan.limits.stdout_bytes,
              plan.limits.stderr_bytes
          ),'''
          new_summary = '''        summary: format!(
              "argv={:?} cwd={} timeout={}ms stdout_limit={} stderr_limit={} stdin=null network=NONE",
              plan.argv,
              plan.cwd.display(),
              plan.limits.timeout.as_millis(),
              plan.limits.stdout_bytes,
              plan.limits.stderr_bytes
          ),'''
          if old_summary not in d:
              raise SystemExit('cotrad approval summary anchor not found')
          d = d.replace(old_summary, new_summary, 1)
          daemon.write_text(d, encoding='utf-8')
          PY

          cargo fmt --all
          rm .github/workflows/sg10-argv-approval-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: align SG-000010 qualification with narrowed authority'
          git push origin HEAD:feat/sg-000010-implementation
