name: SG-000010 Process Client Patch Once

on:
  push:
    branches:
      - feat/sg-000010-implementation

permissions:
  contents: write

jobs:
  patch-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000010-implementation
          fetch-depth: 0
      - name: Patch process.spawn client lifecycle and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/cotra-mcp/src/index.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    }) =>
              asToolResult(
                await kernel.call({
                  workspaceId: workspace_id,
                  capability: "process.spawn",
                  operation: "spawn",
                  arguments: {
                    executable,
                    argv,
                    cwd,
                    timeout_ms,
                    stdout_bytes,
                    stderr_bytes,
                    stdin_policy,
                    network_class
                  },
                  timeoutMs: timeout_ms + 30_000
                })
              )
          );'''
          if old not in text:
              old = '''    }) =>
              asToolResult(
                await kernel.call({
                  workspaceId: workspace_id,
                  capability: "process.spawn",
                  operation: "spawn",
                  arguments: {
                    executable,
                    argv,
                    cwd,
                    timeout_ms,
                    stdout_bytes,
                    stderr_bytes,
                    stdin_policy,
                    network_class
                  },
                  timeoutMs: timeout_ms + 30_000
                })
              )
          );'''
          # Use the exact source-shaped block if formatter indentation differs.
          if old not in text:
              start = text.index('    "process_spawn",')
              block_start = text.rfind('  server.registerTool(', 0, start)
              block_end = text.index('\n\n  server.registerTool(', start)
              block = text[block_start:block_end]
              old_tail = '''    }) =>
              asToolResult(
                await kernel.call({'''
              if 'timeoutMs: timeout_ms + 30_000' not in block:
                  raise SystemExit('expected process_spawn timeout block not found')
              # Structured textual rewrite within the isolated process_spawn registration.
              block = block.replace('''    }) =>
              asToolResult(
                await kernel.call({''', '''    }) => {
              const processKernel = new KernelClient();
              clients.add(processKernel);
              try {
                return asToolResult(
                  await processKernel.call({''')
              block = block.replace('''                  timeoutMs: timeout_ms + 30_000
                })
              )''', '''                  timeoutMs: timeout_ms + 5 * 60_000
                  })
                );
              } finally {
                clients.delete(processKernel);
                processKernel.close();
              }
            }''')
              text = text[:block_start] + block + text[block_end:]
          else:
              new = '''    }) => {
              const processKernel = new KernelClient();
              clients.add(processKernel);
              try {
                return asToolResult(
                  await processKernel.call({
                    workspaceId: workspace_id,
                    capability: "process.spawn",
                    operation: "spawn",
                    arguments: {
                      executable,
                      argv,
                      cwd,
                      timeout_ms,
                      stdout_bytes,
                      stderr_bytes,
                      stdin_policy,
                      network_class
                    },
                    timeoutMs: timeout_ms + 5 * 60_000
                  })
                );
              } finally {
                clients.delete(processKernel);
                processKernel.close();
              }
            }
          );'''
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sg10-process-client-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: isolate process.spawn daemon lifecycle'
          git push origin HEAD:feat/sg-000010-implementation
