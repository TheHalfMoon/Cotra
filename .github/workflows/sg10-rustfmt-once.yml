name: SG-000010 Rustfmt Once

on:
  push:
    branches:
      - feat/sg-000010-implementation

permissions:
  contents: write

jobs:
  rustfmt-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000010-implementation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Apply rustfmt only and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          if [ "$changed" != "crates/cotrad/src/main.rs" ]; then
            echo "Unexpected rustfmt scope:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          rm .github/workflows/sg10-rustfmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/cotrad/src/main.rs .github/workflows/sg10-rustfmt-once.yml
          git diff --cached --check
          git commit -m 'style: apply rustfmt to SG-000010 qualification repair'
          git push origin HEAD:feat/sg-000010-implementation
