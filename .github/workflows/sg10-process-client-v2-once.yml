name: SG-000010 Process Client Patch V2 Once

on:
  push:
    branches:
      - feat/sg-000010-implementation

permissions:
  contents: write

jobs:
  patch-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000010-implementation
          fetch-depth: 0
      - name: Replace process.spawn registration with request-scoped daemon lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/cotra-mcp/src/index.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = '  server.registerTool(\n    "process_spawn",'
          end_marker = '\n\n  server.registerTool(\n    "git_status",'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  server.registerTool(
            "process_spawn",
            {
              description:
                "Execute one argv-only process after fresh local approval inside the selected trusted workspace. No shell string, caller environment, stdin payload, background mode, or process network authority is exposed.",
              inputSchema: processSpawnInputSchema
            },
            async ({
              workspace_id,
              executable,
              argv,
              cwd,
              timeout_ms,
              stdout_bytes,
              stderr_bytes,
              stdin_policy,
              network_class
            }) => {
              // EXECUTE uses a request-scoped daemon. If the MCP-side deadline expires,
              // the finally block closes this daemon; closing cotrad drops its Job handle,
              // preventing an approved process from starting or continuing after the caller
              // has already observed a timeout.
              const processKernel = new KernelClient();
              clients.add(processKernel);
              try {
                return asToolResult(
                  await processKernel.call({
                    workspaceId: workspace_id,
                    capability: "process.spawn",
                    operation: "spawn",
                    arguments: {
                      executable,
                      argv,
                      cwd,
                      timeout_ms,
                      stdout_bytes,
                      stderr_bytes,
                      stdin_policy,
                      network_class
                    },
                    // Runtime timeout is enforced inside the provider. The additional window
                    // is reserved for explicit local approval; expiration still fails closed
                    // because the request-scoped daemon is terminated in finally.
                    timeoutMs: timeout_ms + 5 * 60_000
                  })
                );
              } finally {
                clients.delete(processKernel);
                processKernel.close();
              }
            }
          );'''
          text = text[:start] + replacement + text[end:]
          if 'const processKernel = new KernelClient();' not in text:
              raise SystemExit('processKernel lifecycle patch did not apply')
          if 'timeoutMs: timeout_ms + 30_000' in text[start:start + len(replacement) + 500]:
              raise SystemExit('old process timeout remained after patch')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/sg10-process-client-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached -- apps/cotra-mcp/src/index.ts
          git commit -m 'fix: bind process.spawn to request-scoped daemon'
          git push origin HEAD:feat/sg-000010-implementation
