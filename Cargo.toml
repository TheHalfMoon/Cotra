[workspace]
resolver = "2"
members = [
  "crates/qdral-contracts",
  "crates/qdral-policy",
  "crates/qdral-audit",
  "crates/qdral-approval",
  "crates/qdral-provider-fs",
  "crates/qdral-provider-git",
  "crates/qdral-provider-process",
  "crates/qdral-provider-browser",
  "crates/qdral-provider-uia",
  "crates/qdral-provider-clipboard",
  "crates/qdral-provider-network",
  "crates/qdral-tunnel",
  "crates/qdral-lifecycle",
  "crates/qdrald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Qdral"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
