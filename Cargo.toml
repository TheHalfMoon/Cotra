[workspace]
resolver = "2"
members = [
  "crates/cotra-contracts",
  "crates/cotra-policy",
  "crates/cotra-audit",
  "crates/cotra-provider-fs",
  "crates/cotrad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Cotra"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
