# Mistral Vibe Code MCP configuration for Qdral.
# File: config.toml under mcp_servers. Field names verified against the
# official Vibe Code MCP servers documentation.
# Vibe Code does not support OAuth; both entries below use transports that
# need no OAuth. No tunnel required.

# Local process transport. Preferred: no secrets, no ports.
[[mcp_servers]]
name = "qdral"
transport = "stdio"
command = "qdral"
args = ["mcp", "stdio"]
startup_timeout_sec = 20
tool_timeout_sec = 60

# Loopback Streamable HTTP transport. Set QDRAL_LOOPBACK_TOKEN in the
# environment (at least 32 characters) and start `qdral mcp serve`.
# Replace PORT with the printed listener port. The token travels as a
# bearer header through the documented api_key fields, never in the file.
# [[mcp_servers]]
# name = "qdral_http"
# transport = "streamable-http"
# url = "http://127.0.0.1:PORT/mcp"
# api_key_env = "QDRAL_LOOPBACK_TOKEN"
# api_key_header = "Authorization"
# api_key_format = "Bearer {token}"
# startup_timeout_sec = 20
# tool_timeout_sec = 60
